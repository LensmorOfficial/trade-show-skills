name: Repository Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          python3 -m venv "$RUNNER_TEMP/skill-validation"
          "$RUNNER_TEMP/skill-validation/bin/python" -m pip install -r scripts/requirements.txt
          echo "$RUNNER_TEMP/skill-validation/bin" >> "$GITHUB_PATH"
      - name: Validate skill structure and documented contracts
        run: bash scripts/validate-repo.sh
